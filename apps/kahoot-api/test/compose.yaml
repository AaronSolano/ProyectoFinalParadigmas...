services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: kahoot_f4_test
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kahoot_f4_test"]
      interval: 1s
      timeout: 5s
      retries: 30
  auth:
    profiles: [load]
    build:
      context: ../../..
      dockerfile: apps/kahoot-api/test/Dockerfile
      target: auth
    environment:
      AUTH_DATABASE_URL: postgresql://postgres@postgres:5432/auth_f4_test
      AUTH_PORT: 3001
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:55435:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
  kahoot:
    profiles: [load]
    build:
      context: ../../..
      dockerfile: apps/kahoot-api/test/Dockerfile
      target: kahoot
    environment:
      KAHOOT_DATABASE_URL: postgresql://postgres@postgres:5432/kahoot_f4_test
      AUTH_BASE_URL: http://auth:3001
      PUBLIC_API_URL: http://127.0.0.1:55436
      IMAGE_STORAGE_PATH: /tmp/images
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:55436:3002"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
