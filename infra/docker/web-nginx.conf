# Un solo origen para el navegador: la web, la API REST y Socket.IO.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: se vuelve a resolver el nombre de cada API (TTL corto)
  # para no quedar apuntando a una IP vieja cuando un contenedor se reinicia.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Subidas de imagenes de preguntas (maximo 2 MiB + cabeceras multipart).
  client_max_body_size 3m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Autenticacion (auth-api).
  location /api/v1/auth/ {
    set $auth_upstream auth-api:3001;
    proxy_pass http://$auth_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Cuestionarios, salas, imagenes y resultados (kahoot-api).
  location /api/v1/ {
    set $kahoot_upstream kahoot-api:3002;
    proxy_pass http://$kahoot_upstream;
    proxy_hide_header X-Content-Type-Options;
    add_header X-Content-Type-Options "nosniff" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Canal en vivo (Socket.IO sobre WebSocket).
  location /socket.io/ {
    set $kahoot_upstream kahoot-api:3002;
    proxy_pass http://$kahoot_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Archivos compilados con hash en el nombre: cache larga.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Aplicacion de una sola pagina: cualquier ruta cae en index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
}
