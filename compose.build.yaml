# Variante para construir las imagenes en esta maquina en lugar de descargarlas de Docker Hub:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build --wait
#
# Las imagenes locales llevan el nombre del proyecto (<proyecto>-<servicio>:local) para que dos copias del
# repositorio en la misma maquina no se sobrescriban las imagenes entre si.
services:
  auth-api:
    image: ${COMPOSE_PROJECT_NAME:-rubymind}-auth-api:local
    build:
      context: .
      dockerfile: infra/docker/auth-api.Dockerfile
  kahoot-api:
    image: ${COMPOSE_PROJECT_NAME:-rubymind}-kahoot-api:local
    build:
      context: .
      dockerfile: infra/docker/kahoot-api.Dockerfile
  web:
    image: ${COMPOSE_PROJECT_NAME:-rubymind}-web:local
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_ENABLE_DEBUG_CONTROLS: ${VITE_ENABLE_DEBUG_CONTROLS:-false}
  # Los seeds usan la misma imagen que su API.
  seed-auth:
    image: ${COMPOSE_PROJECT_NAME:-rubymind}-auth-api:local
  seed-kahoot:
    image: ${COMPOSE_PROJECT_NAME:-rubymind}-kahoot-api:local
